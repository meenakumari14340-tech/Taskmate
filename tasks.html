<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskMate - My Tasks</title>
<script>(function(){try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">✔ TaskMate</div>
<button class="burger" id="menuBtn" aria-label="Menu">☰</button>
<nav id="nav"><a href="index.html">Home</a><a href="tasks.html" class="active">My Tasks</a><a href="calendar.html">Calendar</a><a href="insights.html">Insights</a><a href="about.html">About</a><a href="contact.html">Contact</a><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button></nav></header>
<div class="toasts" id="toasts"></div>
<div class="page-title"><h1>My Tasks</h1><p>Add, edit, organise and complete your daily work.</p></div>
<div class="app wide">
<div class="dash">
  <div class="ring" id="ring"><span id="pct">0%</span></div>
  <div class="stats">
    <div class="stat"><b id="total">0</b>Total</div>
    <div class="stat"><b id="pending">0</b>Pending</div>
    <div class="stat"><b id="completed">0</b>Completed</div>
    <div class="stat warn"><b id="overdue">0</b>Overdue</div>
  </div>
</div>
<div class="bar"><div id="barFill"></div></div>

<div class="add">
  <input id="taskInput" placeholder="Enter a new task..." maxlength="100">
  <select id="category"><option>Study</option><option>Exam</option><option>Project</option><option>Personal</option></select>
  <select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select>
  <input type="date" id="dueDate" title="Due date (optional)">
  <button class="btn" id="addBtn">Add Task</button>
</div>
<div class="msg" id="msg"></div>

<div class="toolbar">
  <input id="search" type="search" placeholder="🔍 Search tasks... (press / )">
  <select id="sort">
    <option value="manual">Sort: Manual (drag &amp; drop)</option>
    <option value="new">Sort: Newest first</option>
    <option value="due">Sort: Due date</option>
    <option value="priority">Sort: Priority</option>
    <option value="az">Sort: A → Z</option>
  </select>
  <select id="catFilter"><option value="all">All categories</option><option>Study</option><option>Exam</option><option>Project</option><option>Personal</option></select>
</div>
<div class="filters"><button class="on" data-f="all">All</button><button data-f="pending">Pending</button><button data-f="done">Completed</button></div>

<ul id="taskList"></ul>
<div class="empty" id="empty" hidden></div>

<div class="actions">
  <button class="ghost" id="clearDone">🧹 Clear completed</button>
  <button class="ghost" id="exportBtn">⬇ Export</button>
  <button class="ghost" id="importBtn">⬆ Import</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<div class="pomo">
  <h3>🍅 Focus Timer</h3>
  <div class="time" id="pomoTime">25:00</div>
  <div class="modes"><button class="ghost on" data-m="25">Focus 25</button><button class="ghost" data-m="5">Short 5</button><button class="ghost" data-m="15">Long 15</button></div>
  <div class="ctrl"><button class="btn" id="pomoStart">Start</button><button class="ghost" id="pomoReset">Reset</button></div>
</div>
</div>
<footer>© 2026 TaskMate – Student Task Manager. All Rights Reserved.</footer><script src="script.js"></script></body></html>
