<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskMate - Contact</title>
<script>(function(){try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">✔ TaskMate</div>
<button class="burger" id="menuBtn" aria-label="Menu">☰</button>
<nav id="nav"><a href="index.html">Home</a><a href="tasks.html">My Tasks</a><a href="calendar.html">Calendar</a><a href="insights.html">Insights</a><a href="about.html">About</a><a href="contact.html" class="active">Contact</a><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button></nav></header>
<div class="toasts" id="toasts"></div>
<div class="page-title"><h1>Contact Us</h1><p>Have a question? Send us a message.</p></div>
<div class="contact"><div class="info"><h2>Get In Touch</h2><p>📍 Thovalai, Tamil Nadu</p><p>📞 +91 98765 43210</p><p>✉ support@taskmate.com</p><p>🕒 Mon – Sat : 9 AM – 6 PM</p></div>
<form id="contactForm" novalidate>
<input id="cname" placeholder="Your Name"><div class="err" id="e_cname"></div>
<input id="cemail" type="email" placeholder="Your Email"><div class="err" id="e_cemail"></div>
<input id="cphone" type="tel" placeholder="Mobile number (optional)" maxlength="10"><div class="err" id="e_cphone"></div>
<select id="csubject"><option>General Question</option><option>Feedback</option><option>Report a Bug</option><option>Feature Request</option></select>
<textarea id="cmsg" rows="5" placeholder="Your Message" maxlength="300"></textarea><div class="counter" id="count">0 / 300</div><div class="err" id="e_cmsg"></div>
<div class="err" id="cerr"></div><button class="btn" type="submit">Send Message</button></form></div>
<footer>© 2026 TaskMate – Student Task Manager. All Rights Reserved.</footer><script src="script.js"></script></body></html>
